# Fails a pull request that reaches outside the Family App (see bin/family-guard).
# Skipped for Austin's own pull requests. Required by branch protection on main.
#
# pull_request_target runs this workflow (and bin/family-guard) as they are on
# main, so a branch can't switch the guard off by editing it. The guard only
# reads git objects from the branch; it never runs the branch's code.
#
# Kept in its own file from family-tests so neither check ever shows up as a
# "skipped" duplicate, which GitHub would count as passing.
name: Family guard

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  family-guard:
    if: github.event.pull_request.user.login != 'austinnash80'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the pull request branch
        run: git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.11"
      - name: Only Family App files changed
        run: ruby bin/family-guard "${{ github.event.pull_request.base.sha }}" pr-head
